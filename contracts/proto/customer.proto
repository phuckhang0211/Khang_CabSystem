syntax = "proto3";

package cab.customer.v1;

import "common.proto";

service CustomerService {
  rpc CreateCustomerProfile(CreateCustomerProfileRequest) returns (CustomerProfile);
  rpc GetCustomer(GetCustomerRequest) returns (CustomerProfile);
  rpc UpdateCustomer(UpdateCustomerRequest) returns (CustomerProfile);
  rpc CreateReview(CreateReviewRequest) returns (Review);
  rpc ListReviews(ListReviewsRequest) returns (ListReviewsResponse);
}

message CustomerProfile { string user_id = 1; string display_name = 2; string created_at = 3; string id = 4; }
message CreateCustomerProfileRequest { string user_id = 1; string display_name = 2; }
message GetCustomerRequest { string user_id = 1; }
message UpdateCustomerRequest { string display_name = 1; }
message Review { string review_id = 1; string trip_id = 2; string customer_id = 3; string driver_id = 4; int32 rating = 5; string comment = 6; string created_at = 7; }
message CreateReviewRequest { string trip_id = 1; int32 rating = 2; optional string comment = 3; }
message ListReviewsRequest { string trip_id = 1; int32 page = 2; int32 limit = 3; }
message ListReviewsResponse { repeated Review items = 1; cab.common.v1.PageInfo page_info = 2; }
